name: Website Audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: Target URL to audit
        required: true
        default: 'https://example.com/'
        type: string
      summary:
        description: Print compact summary
        type: boolean
        default: false
      security:
        description: Run security checks (headers, TLS, ZAP)
        type: boolean
        default: false

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # pa11y uses puppeteer; point it at the pre-installed system Chrome
      # so no extra Chromium download is needed.
      - name: Locate system Chrome for pa11y
        run: |
          CHROME=$(which google-chrome-stable 2>/dev/null \
               || which google-chrome        2>/dev/null \
               || which chromium-browser     2>/dev/null || true)
          [ -n "$CHROME" ] && echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Run audit
        env:
          AUDIT_URL: ${{ inputs.url }}
        run: |
          ARGS=()
          [[ "${{ inputs.summary }}"  == "true" ]] && ARGS+=(--summary)
          [[ "${{ inputs.security }}" == "true" ]] && ARGS+=(--security)
          ./audit.sh "${ARGS[@]}" "$AUDIT_URL"

      - name: Write job summary
        if: always()
        env:
          AUDIT_URL: ${{ inputs.url }}
        run: node .github/scripts/ci-summary.mjs

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ github.run_number }}
          path: reports/
          retention-days: 30
